<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>系统文件与分享</title>
    <style>
      /* 与主应用深色主题同款：这是一块只在权限流程里露面的过场页 */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0d;
        color: #f1eff6;
        font: 14px/1.6 system-ui, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }

      .box {
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 24px;
        max-width: 420px;
        text-align: center;
        animation: rise-in 0.18s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .box {
          animation: none;
        }
      }

      #msg {
        color: #9690a8;
        font-size: 13px;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      button {
        font: inherit;
        padding: 8px 18px;
        border-radius: 6px;
        border: 1px solid #46464e;
        background: #9a90c4;
        color: #14121d;
        font-weight: 600;
        touch-action: manipulation;
        transition: transform 0.1s ease;
      }

      button:active {
        transform: translateY(1px);
      }

      button.ghost {
        background: transparent;
        color: #f1eff6;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div id="msg">正在检查权限…</div>
      <div class="row">
        <button id="grant" hidden>去开启权限</button>
        <button id="back" class="ghost" hidden>返回应用</button>
      </div>
    </div>
    <script type="module" src="storage.js"></script>
  </body>
</html>
